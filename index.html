<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VLDST CASE x STARS</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header class="topbar">
      <div>
        <div class="logo">VLDST</div>
        <div class="subtitle">CASE x STARS</div>
      </div>

      <div class="balance">
        ⭐ <span id="balance">0</span>
      </div>
    </header>

    <main>

      <!-- Главная -->
      <section id="home" class="page active">
        <div class="hero">
          <div class="hero-title">VLDST CASE</div>
          <div class="hero-text">
            Покупай коллекционные подарки за Stars
          </div>
          <button class="primary" onclick="showPage('shop')">
            Открыть каталог
          </button>
        </div>

        <h2>Популярные подарки</h2>
        <div id="popular" class="grid"></div>
      </section>

      <!-- Магазин -->
      <section id="shop" class="page">
        <h1>🎁 Подарки</h1>
        <div id="gifts" class="grid"></div>
      </section>

      <!-- Инвентарь -->
      <section id="inventory" class="page">
        <h1>🎒 Инвентарь</h1>
        <div id="inventoryList" class="grid"></div>
      </section>

      <!-- Профиль -->
      <section id="profile" class="page">
        <h1>👤 Профиль</h1>

        <div class="profile-card">
          <div class="avatar" id="avatar">?</div>

          <div>
            <div id="username">Пользователь</div>
            <small id="telegramId"></small>
          </div>
        </div>

        <div class="stats">
          <div>
            <span>⭐</span>
            <b id="profileBalance">0</b>
            <small>Stars</small>
          </div>

          <div>
            <span>🎁</span>
            <b id="inventoryCount">0</b>
            <small>Подарков</small>
          </div>
        </div>
      </section>

      <!-- Рефералы -->
      <section id="referrals" class="page">
        <h1>👥 Рефералы</h1>

        <div class="ref-card">
          <div class="ref-icon">👥</div>
          <h2>Приглашай друзей</h2>
          <p>
            Поделись своей ссылкой и следи за приглашёнными пользователями.
          </p>

          <div class="ref-link" id="refLink">
            Загрузка...
          </div>

          <button class="primary" onclick="copyReferral()">
            Скопировать ссылку
          </button>
        </div>
      </section>

    </main>

    <nav class="bottom-nav">

      <button onclick="showPage('home')" data-page="home">
        <span>⌂</span>
        <small>Главная</small>
      </button>

      <button onclick="showPage('shop')" data-page="shop">
        <span>🎁</span>
        <small>Подарки</small>
      </button>

      <button onclick="showPage('inventory')" data-page="inventory">
        <span>🎒</span>
        <small>Инвентарь</small>
      </button>

      <button onclick="showPage('referrals')" data-page="referrals">
        <span>👥</span>
        <small>Рефералы</small>
      </button>

      <button onclick="showPage('profile')" data-page="profile">
        <span>👤</span>
        <small>Профиль</small>
      </button>

    </nav>

  </div>

  <script src="app.js"></script>

</body>
                     </html>
